services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: auth-nest-dev
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./:/app
      - /app/node_modules
    restart: unless-stopped
